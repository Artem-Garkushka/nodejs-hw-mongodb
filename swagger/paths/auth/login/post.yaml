tags:
  - Auth
summary: Login User
operationId: loginUser
description: Authenticate user and return access token
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: User email
          password:
            type: string
            description: User password
responses:
  '200':
    description: Successfully logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOi...
  '401':
    $ref: ../../../components/responses/401.yaml
  '400':
    $ref: ../../../components/responses/400.yaml